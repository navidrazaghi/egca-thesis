# Full EGCA configuration — matches Table 4-1 / Table 5-2 of the thesis.
model:
  embed_dim: 256
  camera:
    backbone: resnet34
    pretrained: true
    image_size: [160, 704]        # H, W (3 front cameras stitched)
  lidar:
    x_range: [0.0, 32.0]          # forward (m)
    y_range: [-16.0, 16.0]        # lateral (m)
    z_range: [-2.5, 1.5]
    pillar_size: 0.25             # -> 128 x 128 BEV grid
    max_pillars: 4096
    max_points_per_pillar: 24
    pillar_feat_dim: 64
  fusion:
    # egca | concat | late | camera_only | lidar_only   (Tables 5-4, 5-5)
    mode: egca
    # image | bev.  "bev" projects the camera features into the LiDAR's metric
    # grid before fusion so the two branches share one frame; "image" keeps the
    # original arrangement where the correspondence has to be learned.
    camera_space: image
    depth_bins: 32
    # decoder | both | fusion.  Where the navigation goal enters the policy.
    # "decoder" is the original: the goal is fed to the GRU at every step and
    # nowhere else, which is the late-conditioning bottleneck LEAD reports.
    # "fusion" is required by readout: query -- with the GRU gone, the goal
    # token is the only route the goal has into the policy.
    goal_injection: fusion
    num_blocks: 4                 # L
    num_heads: 4                  # H
    ffn_dim: 512
    attention: linear             # linear | full  (ablation switch)
    gate: true                    # sensor-reliability gate (ablation switch)
    gate_hidden: 128
    # mean | attention.  Mean pooling divides each branch's contribution by its
    # token count -- 440 camera tokens against 4096 pillars -- which is the
    # mechanism behind FINDINGS 4: the gate read pooling statistics, not
    # sensors, and rose when the camera was removed.  Learned queries let each
    # branch summarise what matters instead of diluting it.
    pooling: attention
    pool_queries: 4
    # scalar | vector.  A scalar gate can only interpolate between the two
    # summaries, strictly less expressive than concat's linear merge -- which
    # is why no_gate scored identically.  Per-dimension keeps the reliability
    # reading of Eq. 4.8 while letting each feature choose its source.
    gate_form: vector
    # Weight of the gate-supervision BCE (0 disables).  Sensor dropout already
    # manufactures frames whose reliability is known -- a dropped modality
    # carries zero information -- so the gate is trained toward 0 (camera
    # dropped) or 1 (LiDAR dropped) on exactly those frames, instead of hoping
    # the meaning emerges.  FINDINGS 4 measured that it does not emerge.
    gate_supervision: 0.3
    # none | film.  Zero-initialised feature-wise modulation of both branches
    # by the ego state, so perception can look further ahead at speed and
    # toward the turn at a junction.  At step 0 it is exactly the identity, so
    # any difference from the unconditioned model is learned, not initial.
    ego_cond: film
  decoder:
    hidden_dim: 256
    horizon: 4                    # T waypoints
    wp_dt: 0.5                    # seconds between waypoints
    # pooled | query.  "pooled" is the original mean-pool into a GRU; "query"
    # lets learned planning queries read the fused tokens directly and adds a
    # target-speed head, removing the spatial bottleneck before the trajectory.
    # The pooled readout averages 4500 spatial tokens into one 256-d vector
    # before anything decides the trajectory -- the car to be avoided and the
    # empty lane beside it arrive as the same average, and every fusion
    # ablation funnels through the same pipe, which is why Table 5-5 is flat.
    readout: query
    # Fraction of training samples for which the speedometer is withheld and a
    # learned "unknown" token stands in.  Measured on the run trained without
    # it: holding the scene fixed and sweeping the speed input from 0 to 6 m/s
    # swings the predicted target speed by 5.13 m/s, a dependence of 0.85 -- the
    # network reads the speedometer and barely consults the sensors.  That is an
    # excellent predictor on recorded data, where the next speed really is close
    # to the current one, and a self-sustaining standstill on the road.
    speed_dropout: 0.5
    query_layers: 3
    speed_bins: [0.0, 2.0, 4.0, 6.0, 8.0]
  aux:
    bev_seg: true                 # ablation switch
    # 5 for the published set (0 free, 1 road, 2 lane, 3 vehicle, 4 pedestrian
    # -- what decode_topdown emits; >= 5 is also what makes the adapter decode
    # the agent channels and the driving agent brake on the predicted vehicle
    # distance).  The own collection additionally writes 5 = static obstacle,
    # so training with data.source: own needs 6 here.
    bev_classes: 5
    depth: true

train:
  # ~45 min/epoch on the published set at stride 1; 30 epochs is about a day
  # with validation, which is what the shared card actually absorbs.  The
  # cosine schedule anneals to zero at whatever this is set to.
  epochs: 30
  # Effective batch is 128 (Table 5-2), reached by accumulation. A true 128
  # peaks at 36.4 GiB of the card's 39.5 with the mean-pool readout and OOM'd at
  # epoch 7 on a dense point cloud; the query readout does not fit at 128 at all.
  #
  # 32 x 4 rather than 64 x 2 because of a spike nobody has explained yet: the
  # query readout sits at 22.4 GiB for seventy seconds and then jumps to 40.4 and
  # dies, while the architectural worst case -- every sample padded to
  # max_pillars -- measures 22.35 GiB. 32 peaks at 11.4 GiB in that same test,
  # which leaves room for an 18 GiB surprise. tf_base was trained at 64 x 2, so
  # the two rungs share an effective batch but not a batch-norm batch; the
  # step-level log now records peak memory and pillar count so the spike is
  # caught in the log rather than only in a traceback.
  batch_size: 32
  grad_accum: 4
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  sensor_dropout: 0.15            # rho (ablation switch: 0.0)
  # Mirror the whole sample about the ego's forward axis -- image, cloud, both
  # rasters, waypoints, goal and the left/right command together; see
  # dataset._mirror.  Exact for this rig, so it doubles the effective dataset
  # rather than approximating it.
  #
  # It applies to `data.source: own` only.  The TransFuser adapter takes the
  # photometric jitter and the LiDAR jitter but not the mirror, so this value is
  # inert when training on that set.  Left that way deliberately: mirroring it
  # correctly means flipping six fields in a new code path, and the runs this
  # thesis reports were trained without it, so turning it on now would change
  # the training distribution without any measurement of what it did.
  flip_prob: 0.5
  amp: true
  num_workers: 24
  # Off deliberately: pinned pages cannot be moved, and 465 MB batches in flight
  # fragmented host memory badly enough to halve throughput.  See train.py.
  pin_memory: false
  log_every: 50
  # A new directory per architecture revision: the v2 switches above change the
  # state-dict shape, so letting this run resume from or overwrite the v1
  # checkpoints would either crash or destroy the runs the thesis reports.
  ckpt_dir: checkpoints/egca_v2

control:
  lateral:  {kp: 1.25, ki: 0.75, kd: 0.30, window: 20}
  longitudinal: {kp: 5.0, ki: 0.5, kd: 1.0, window: 20}
  max_throttle: 0.75
  brake_speed_ratio: 1.05         # brake if v > ratio * v_des
  clip_delta: 0.25
  # Creeping, to break the standstill the policy cannot leave on its own.
  # The threshold is deliberately longer than a red light so that waiting
  # legally is never interrupted.
  control_hz: 20.0
  creep_after_s: 55.0
  creep_for_s: 1.5
  creep_speed: 4.0
  # Reversing out of a wedge. 26 of 36 Longest6 routes ended "blocked", and the
  # trace of one shows what that is: throttle held at 0.749 with the brake off
  # and the speed at 0.00 for the 180 s the evaluator waits before ending the
  # route. Creeping cannot help, since forward is the direction that is blocked.
  #
  # Sustained throttle with no motion is also what separates a wedge from
  # waiting legitimately -- at a red light the controller commands brake, so the
  # counter never starts. Verified on all four cases, including that it does not
  # fire while driving or with anything behind the car.
  unstick_after_s: 4.0
  unstick_for_s: 1.2
  unstick_speed: 2.0

data:
  # own | transfuser.  "own" is the collected dataset below; "transfuser" reads
  # the published dataset the baselines were trained on, which is what makes the
  # comparison in Chapter 5 a measurement rather than a citation.  transfuser is
  # the default because it is what the next run trains on; own was the binding
  # constraint (validation flattened at epoch 12 on 137k frames).
  source: transfuser
  transfuser_root: ~/transfuser/data
  # Rebuild the waypoint target from the pose the car actually reached rather
  # than the block stored with the frame.  See transfuser_dataset.__init__ for
  # the measurement; in short the stored labels are right to 0.080 m while the
  # car moves and wrong by 5.6x on exactly the frames where it pulls away from a
  # standstill, which is the closed-loop failure.  False reproduces the runs
  # trained before this was found.
  tf_relabel: true
  # Screening stride: keep every Nth frame of the published set. 1 is the full
  # set and is what a reported result must use. 4 is the screening setting --
  # about 51k training frames, a working set that stays in page cache, so the
  # run is faster than the frame ratio alone suggests. Consecutive frames of one
  # route are nearly identical, so this costs far less than dropping towns,
  # which would also destroy the held-out-town split's meaning.
  tf_frame_stride: 1
  tf_towns_val: [Town05]
  tf_towns_all: [Town01, Town02, Town03, Town04, Town05, Town06, Town07, Town10HD]
  # Evenly spaced subset of the held-out town used for per-epoch validation.
  # 0 disables it.  8000 frames is a 2.6% standard error on the waypoint error,
  # an order of magnitude below the epoch-to-epoch movement it has to resolve,
  # and it returns a fifth of the run's disk budget to training.
  val_max_frames: 8000
  root: dataset/
  towns_train: [Town01, Town02, Town03, Town04, Town06]
  # Town05 is collected by nobody: it is the unseen town of the closed-loop
  # generalization test (Appendix C).  Validation uses held-out routes instead.
  towns_unseen: [Town05]
  val_every_n_routes: 20
  seg_size: [128, 128]
  depth_size: [80, 352]           # half-resolution depth target
