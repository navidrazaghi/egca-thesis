# Full EGCA configuration — matches Table 4-1 / Table 5-2 of the thesis.
model:
  embed_dim: 256
  camera:
    backbone: resnet34
    pretrained: true
    image_size: [160, 704]        # H, W (3 front cameras stitched)
  lidar:
    x_range: [0.0, 32.0]          # forward (m)
    y_range: [-16.0, 16.0]        # lateral (m)
    z_range: [-2.5, 1.5]
    pillar_size: 0.25             # -> 128 x 128 BEV grid
    max_pillars: 4096
    max_points_per_pillar: 24
    pillar_feat_dim: 64
  fusion:
    # egca | concat | late | camera_only | lidar_only   (Tables 5-4, 5-5)
    mode: egca
    # image | bev.  "bev" projects the camera features into the LiDAR's metric
    # grid before fusion so the two branches share one frame; "image" keeps the
    # original arrangement where the correspondence has to be learned.
    camera_space: image
    depth_bins: 32
    # decoder | both | fusion.  Where the navigation goal enters the policy.
    # "decoder" is the original: the goal is fed to the GRU at every step and
    # nowhere else, which is the late-conditioning bottleneck LEAD reports.
    goal_injection: decoder
    num_blocks: 4                 # L
    num_heads: 4                  # H
    ffn_dim: 512
    attention: linear             # linear | full  (ablation switch)
    gate: true                    # sensor-reliability gate (ablation switch)
    gate_hidden: 128
  decoder:
    hidden_dim: 256
    horizon: 4                    # T waypoints
    wp_dt: 0.5                    # seconds between waypoints
    # pooled | query.  "pooled" is the original mean-pool into a GRU; "query"
    # lets learned planning queries read the fused tokens directly and adds a
    # target-speed head, removing the spatial bottleneck before the trajectory.
    readout: pooled
    query_layers: 3
    speed_bins: [0.0, 2.0, 4.0, 6.0, 8.0]
  aux:
    bev_seg: true                 # ablation switch
    bev_classes: 6                # road, lane-marking, vehicle, pedestrian, obstacle, free
    depth: true

train:
  epochs: 60
  batch_size: 128
  lr: 1.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 2
  sensor_dropout: 0.15            # rho (ablation switch: 0.0)
  # Mirror the whole sample about the ego's forward axis.  Exact for this rig
  # (equal-FOV cameras at -55/0/+55), so it doubles the effective dataset rather
  # than approximating it; see dataset._mirror.  Set 0.0 to disable.
  flip_prob: 0.5
  amp: true
  num_workers: 8
  log_every: 50
  ckpt_dir: checkpoints/egca

control:
  lateral:  {kp: 1.25, ki: 0.75, kd: 0.30, window: 20}
  longitudinal: {kp: 5.0, ki: 0.5, kd: 1.0, window: 20}
  max_throttle: 0.75
  brake_speed_ratio: 1.05         # brake if v > ratio * v_des
  clip_delta: 0.25
  # Creeping, to break the standstill the policy cannot leave on its own.
  # The threshold is deliberately longer than a red light so that waiting
  # legally is never interrupted.
  control_hz: 20.0
  creep_after_s: 55.0
  creep_for_s: 1.5
  creep_speed: 4.0

data:
  # own | transfuser.  "own" is the collected dataset below; "transfuser" reads
  # the published dataset the baselines were trained on, which is what makes the
  # comparison in Chapter 5 a measurement rather than a citation.
  source: own
  transfuser_root: ~/transfuser/data
  tf_towns_val: [Town05]
  tf_towns_all: [Town01, Town02, Town03, Town04, Town05, Town06, Town07, Town10HD]
  root: dataset/
  towns_train: [Town01, Town02, Town03, Town04, Town06]
  # Town05 is collected by nobody: it is the unseen town of the closed-loop
  # generalization test (Appendix C).  Validation uses held-out routes instead.
  towns_unseen: [Town05]
  val_every_n_routes: 20
  seg_size: [128, 128]
  depth_size: [80, 352]           # half-resolution depth target
